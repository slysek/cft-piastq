[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cft-piastq"
version = "0.1.0"
description = "Qiskit-compatible client facades for PiastQ managed, direct, and fake execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CFT PiastQ contributors" },
]
keywords = ["qiskit", "piastq", "aqt", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "qiskit>=1.4,<2",
    "httpx>=0.27,<1",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-httpx>=0.35,<0.36",
    "PyYAML>=6,<7",
    "ruff>=0.6,<1",
]
direct = [
    "pcss-qapi[aqt]>=0.2.2,<0.3",
    "qiskit-aqt-provider>=1.14,<1.15",
    "tqdm>=4.66,<5",
]
fake = [
    "qiskit-aer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/slysek/cft-piastq"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["cft_piastq"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["cft_piastq"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
