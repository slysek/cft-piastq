[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cft-piastq"
version = "0.1.0"
description = "Qiskit-compatible client facades for PiastQ managed, direct, and fake execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CFT PiastQ contributors" },
]
keywords = ["qiskit", "piastq", "aqt", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "qiskit",
    "httpx",
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
direct = [
    "pcss-qapi",
    "qiskit-aqt-provider",
]
fake = [
    "qiskit-aer",
]

[project.urls]
Homepage = "https://github.com/cft-piastq/cft-piastq"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["cft_piastq"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
