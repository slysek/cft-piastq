name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,direct]"

      - name: Run tests with coverage
        run: python -m pytest --cov=cft_piastq --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: python -m ruff check src tests examples

      - name: Type check
        run: python -m mypy src/cft_piastq

      - name: Import package
        run: python -c "from cft_piastq import PiastQClient, PiastQSampler; print('import ok')"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: python -m sphinx -W -b html docs/source docs/_build/html
